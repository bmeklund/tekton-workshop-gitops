apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-foundation
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: tekton-workshop
  source:
    repoURL: https://github.com/bmeklund/tekton-workshop-gitops.git
    targetRevision: main
    path: platform/foundation
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 20
    syncOptions:
      - ApplyOutOfSyncOnly=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-redhat-operators
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
