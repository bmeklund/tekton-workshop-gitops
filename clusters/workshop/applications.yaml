---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workshop-environment
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: tekton-workshop
  source:
    repoURL: https://github.com/bmeklund/tekton-workshop-gitops.git
    targetRevision: main
    path: charts/workshop-environment
    helm:
      releaseName: tekton-workshop
      parameters:
        - name: workshop.userCount
          value: "1"
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    retry:
      limit: 30
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - SkipDryRunOnMissingResource=true
